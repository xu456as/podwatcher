name: build-and-push-image

# 触发方式：
#   1. 手动触发（Actions 页面选本 workflow，可填 tag，默认 latest）
#   2. 推送形如 v0.0.1 的 git tag（镜像 tag 自动用 v0.0.1）
# 镜像推送到 GitHub Container Registry（ghcr.io），使用仓库自带的 GITHUB_TOKEN
# 登录，无需在 Settings 里配置任何 secret。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（默认 latest）"
        required: false
        default: "latest"
  push:
    tags:
      - "v*"

# packages: write 允许本 workflow 用 GITHUB_TOKEN 往 ghcr.io 推镜像
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发时取 inputs.tag；tag 推送时 inputs 为空，取 git tag 名
      - name: Resolve image tag
        id: meta
        run: |
          # 镜像名 = ghcr.io/<仓库 owner>/<仓库名>，随仓库自动变化
          # （如 ghcr.io/ianwoolf/podwatcher）。GHCR 要求全小写，统一转小写。
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # 需要 arm64 时取消下一行注释（会走 QEMU，构建变慢）：
          # platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
