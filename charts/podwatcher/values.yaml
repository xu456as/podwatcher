namespace: podwatcher
# Additional container env entries, including valueFrom.secretKeyRef.
extraEnv: []
createNamespace: true
name: podwatcher
replicaCount: 1
image:
  repository: sonic_lw
  tag: latest
  pullPolicy: Never
serviceAccount:
  create: true
  name: podwatcher
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
env:
  PODWATCHER_CONFIG: "/app/config/config.yaml"
  LOG_MAX_SIZE: "100M"
  LOG_ROTATE_INTERVAL: "5min"
config:
  cluster:
    # Empty preserves ConfigMap discovery; set to the injected variable name.
    nameEnv: ""
  elasticsearch:
    isDebug: false
    timeoutSeconds: 20
    insecureSkipVerify: false
    address: ""
    username: ""
    passwordEnv: "ES_PASSWORD"
    index: "podwatcher-events"
  prometheus:
    timeoutSeconds: 20
    insecureSkipVerify: true
    address: "http://127.0.0.1:9090" # replace by environment variable
    tokenEnv: "PROMETHEUS_TOKEN" # replace by environment variable
    username: "mock"
    passwordEnv: "mock"
  log:
    file: "/var/log/podwatcher/podwatcher.log"
    maxSize: 100
    maxNum: 5
  pods:
    resumeFile: "/var/log/podwatcher/pods-resume.json"
    stateFile: "/var/log/podwatcher/state.json"
    maxApplications: 5000
    maxPodRecords: 10000
    # downstream checkpoint API for the watch resourceVersion; empty falls
    # back to resumeFile. Override per environment in overlays.
    checkpointUrl: ""
    checkpointFlushSeconds: 10
logrotate:
  conf: |-
    /var/log/podwatcher/podwatcher.log {
        rotate 3
        maxsize {{ .Values.env.LOG_MAX_SIZE }}
        copytruncate
        compress
        missingok
        notifempty
        dateext
        dateformat -%Y%m%d-%s
    }
